name: NFL 観戦ガイド更新

# 土日月火 15:00 JST に自動更新。
# GitHub の cron は UTC 基準なので 15:00 JST = 06:00 UTC。
# 曜日: 6=土, 0=日, 1=月, 2=火(JST の 15 時は UTC でも同じ曜日)。
on:
  schedule:
    - cron: "0 6 * * 6,0,1,2"
  workflow_dispatch:        # 手動実行も可能(Actions タブの Run workflow)

# 生成物(index.html / data/)をリポジトリに書き戻すため書き込み権限を付与
permissions:
  contents: write

concurrency:
  group: nfl-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ページを生成(ESPN 公開データから)
        run: python generate.py       # 追加ライブラリ不要(標準ライブラリのみ)

      - name: 変更をコミット(あれば)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "変更なし。コミットをスキップします。"
          else
            git commit -m "自動更新: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
